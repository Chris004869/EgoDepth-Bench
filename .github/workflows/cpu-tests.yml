name: CPU validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU dependencies
        run: python -m pip install -e ".[dev,download,plot]"
      - name: Run scientific contract tests
        run: python -m pytest -q
      - name: Run synthetic scoring example
        run: python examples/synthetic_smoke.py
      - name: Export archived results
        run: python scripts/export_archived_results.py --output outputs/archived_results
