name: CPU validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Rebuild the archived tables with the standard library
        run: python -I -S scripts/export_archived_results.py --output outputs/archived_results
      - name: Install the CPU package and test dependencies
        run: python -m pip install ".[dev,download,plot]"
      - name: Run scientific contract tests
        run: python -m pytest -q
      - name: Run synthetic scoring example
        run: python examples/synthetic_smoke.py --output-dir "$RUNNER_TEMP/egodepth-example"
      - name: Score the example with the installed CLI outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          egodepth-score --config egodepth-example/synthetic_config.yaml \
            --predictions-dir egodepth-example/synthetic_predictions --method smoke \
            --output egodepth-example/installed-score.json
          python - <<'PYTHON'
          import json
          from pathlib import Path

          metrics = json.loads(Path("egodepth-example/installed-score.json").read_text())["strata"]["roi::full"]["metrics"]
          assert (metrics["abs_rel"], metrics["mae_z_cm"], metrics["coverage"]) == (0.1875, 12.5, 0.75)
          PYTHON
