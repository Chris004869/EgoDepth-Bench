[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egodepth-bench"
version = "1.0.0"
description = "EgoDepth-Bench data readers, metric-depth evaluation, and baseline adapters"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "GenRobot"}]
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<5",
  "Pillow>=9.5",
  "PyYAML>=6",
]

[project.urls]
Homepage = "https://egodepth-bench.github.io/"
Repository = "https://github.com/Chris004869/EgoDepth-Bench"
Documentation = "https://github.com/Chris004869/EgoDepth-Bench/blob/main/docs/EVALUATION.md"
Issues = "https://github.com/Chris004869/EgoDepth-Bench/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
plot = ["matplotlib>=3.7"]
download = ["zstandard>=0.20"]
train = ["torch>=2.4"]

[project.scripts]
egodepth-score = "egodepth_eval.score.external:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/egodepth-bench" = ["configs/model_sources.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
